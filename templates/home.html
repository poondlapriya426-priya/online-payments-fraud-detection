<form action="/predict" method="post">
    <input type="number" name="type" placeholder="Type (e.g., 1)" required>
    
    <input type="number" name="amount" placeholder="Transaction Amount" required>
    <input type="number" name="oldbalance" placeholder="Old Balance" required>
    <input type="number" name="newbalance" placeholder="New Balance" required>
    
    <button type="submit">Check Transaction</button>
</form>
